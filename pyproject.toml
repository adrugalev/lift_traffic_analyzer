[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lift-traffic-analyzer"
version = "61.0.0"
description = "Расчёт по ГОСТ и симуляция пассажиропотока"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.38,<2",
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
  "plotly>=5.20,<7",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "reportlab>=4.1,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
simulation = ["simpy>=4.1,<5", "scipy>=1.11,<2"]
test = ["pytest>=8.0,<9", "hypothesis>=6.100,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "regression: тесты по подтверждённым нормативным примерам",
  "performance: длительные проверки производительности",
]

[tool.setuptools]
packages = [
  "src",
  "src.models",
  "src.engines",
  "src.controllers",
  "src.reports",
  "src.services",
  "src.utils",
]
